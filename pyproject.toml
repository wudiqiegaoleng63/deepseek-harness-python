[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-python"
version = "0.1.0.dev0"
description = "Native Python implementation of DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepSeek Harness Python contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
dsh-python = "deepseek_harness.cli:main"
dsh-build-frontend = "deepseek_harness.frontend_build:main"

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pyright>=1.1.390,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
